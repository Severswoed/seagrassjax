<!doctype html>
<html lang="{{ site.lang | default: 'en-US' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title | escape }} | {% endif %}{{ site.title | escape }}</title>
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <meta name="theme-color" content="#062F38">
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <link rel="icon" href="{{ '/assets/images/seagrassjax-logo-no%20background.png' | relative_url }}" type="image/png">
    <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="{{ site.title | escape }}">
    <meta property="og:title" content="{% if page.title %}{{ page.title | escape }} | {% endif %}{{ site.title | escape }}">
    <meta property="og:description" content="{{ page.description | default: site.description | escape }}">
    <meta property="og:url" content="{{ page.url | absolute_url }}">
    <meta name="twitter:card" content="summary">
    {% if page.url == '/' %}
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "LocalBusiness",
        "name": {{ site.data.business.name | jsonify }},
        "description": {{ site.data.business.description | jsonify }},
        "url": {{ '/' | absolute_url | jsonify }},
        "areaServed": {{ site.data.business.service_areas | jsonify }}
      }
    </script>
    {% endif %}
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    {% include header.html %}
    <main id="main" tabindex="-1">
      {{ content }}
    </main>
    {% include footer.html %}
    {% if page.url == '/estimate/' %}<script src="https://web3forms.com/client/script.js" async defer></script>{% endif %}
    <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
  </body>
</html>
